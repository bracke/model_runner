name = "model_runner"
description = "Local GGUF language-model execution engine and runner"
version = "0.1.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT"
website = "https://github.com/bracke/model_runner"
long-description = "model_runner loads a local GGUF model file, validates its container strictly, prepares a bounded Llama-compatible decoder-only execution plan, tokenizes prompts, evaluates the model on the CPU in Ada, maintains an explicit KV cache, samples output tokens, decodes them incrementally and streams the generated text. Inference is local only: no network access, no daemon, no delegation to an external model runtime."
tags = ["gguf", "llm", "inference", "cli"]
project-files = ["model_runner.gpr"]
executables = ["model_runner"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
terminal_styles = "=0.1.0-dev"

[[depends-on]]
messages = "~0.1.0"

[[pins]]
terminal_styles = { path = "../terminal_styles" }

[[pins]]
messages = { path = "../messages" }

# model_runner needs none of the following itself. They arrive because
# `messages` pins `i18n`, whose pre-build tooling regenerates CLDR and tzdb
# data over HTTPS and so builds `httpclient`, whose TLS backend is `ssllib`.
# Alire honours pins only in the root crate, so every root that builds this
# graph has to name them, exactly as versionlib and sitefetch do.
[[pins]]
httpclient = { path = "../httpclient" }

[[pins]]
ssllib = { path = "../ssllib" }

[[pins]]
cryptolib = { path = "../cryptolib" }

[[pins]]
truststores = { path = "../truststores" }

[[pins]]
hostkit = { path = "../hostkit" }

[[pins]]
zlib = { path = "../zlib" }

# Build dependencies in the development profile (-Og) too, not the default
# release (-O3). Keeping every root on the same profile lets them share object
# files instead of forcing a rebuild whenever a different root is built.
# Development is what you build during development; release is for a release.
[build-profiles]
"*" = "development"

[[actions]]
type = "test"
command = ["sh", "-c", "cd tests && alr -n build && ./bin/tests test"]
